<div class="table-responsive">
  <table class="table table-hover">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Author</th>
        <th>Articles</th>
        <th>Total Favorites</th>
        <th>First Article Day</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users$ | async; let i = index">
        <td><span class="badge badge-success">{{ i + 1 }}</span></td>
        <td><a [routerLink]="['/profile', user.username]">{{ user.username }}</a></td>
        <td>{{ user.articleCount }}</td>
        <td>{{ user.totalFavorites }}</td>
        <td>{{ user.firstArticleDate | date }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="summary-cards">
  <div class="card" *ngFor="let stat of summaryStats">
    <div class="card-body">
      <h5 class="card-title">{{ stat.title }}</h5>
      <p class="card-text">{{ stat.value }}</p>
    </div>
  </div>
</div>
